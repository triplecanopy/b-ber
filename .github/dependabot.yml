# Dependency update policy (TASK-123).
#
# The rule in one line: **pin-worthy minor and patch updates arrive automatically;
# majors do not, unless a security advisory requires one.**
#
# How that is expressed: `ignore` with `update-types: version-update:semver-major`.
# The `version-update:` prefix is load-bearing — it scopes the rule to *version*
# updates and leaves the security path alone, so a vulnerability that can only be
# fixed by a major still produces a PR. An `ignore` entry naming a dependency with
# no `update-types` does NOT behave this way; it expands to `>= 0` and can suppress
# that package's security updates too. Never write one.
#
# Not here yet: `versioning-strategy: increase`. It bumps the lower bound of a
# range, which is meaningless against the `^` specifiers this repo still uses. It
# lands with TASK-122, when specifiers are pinned exact.
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Dependabot picks up the workspace manifests from the root lockfile on its
    # own — PRs already arrive scoped to /packages/*, so no per-directory entries.
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10

    ignore:
      # No major version bumps as routine maintenance. Security updates are
      # unaffected — see the header.
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
      # Scoped packages, explicitly. GitHub does not document whether `*`
      # crosses the `/` in a scoped name, so cover it either way.
      # NOTE: this alone did not work — #648 was built on the commit that added
      # it and still carried `@types/use-sync-external-store` 0.0.6 -> 1.7.0.
      # The group `update-types` below is what actually closes that hole.
      - dependency-name: '@*/*'
        update-types:
          - 'version-update:semver-major'

      # `0.x` releases: semver treats a minor bump below 1.0.0 as breaking, but
      # Dependabot classifies it as `semver-minor`, so the major rule above does
      # not cover it. #643 would have taken `pureimage` 0.1 -> 0.4 — the library
      # that renders the default cover — as routine maintenance.
      #
      # There is no general switch for this, so it is enumerated. Nine packages
      # today. Remove an entry when its package reaches 1.0.0, and add one when a
      # new 0.x dependency appears; `node scripts/check-zero-major-deps.js`
      # fails if this list and the manifests disagree.
      - dependency-name: '@swc/jest'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/use-sync-external-store'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'image-size'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'markdown-it-front-matter'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'os-browserify'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'pureimage'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'quote'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'react-attr-converter'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'tsdown'
        update-types: ['version-update:semver-minor']

      # js-yaml is declared as `^3` in some packages and `^4` in others, and a
      # grouped update resolves that downward — #643 and #648 both proposed
      # b-ber-testing's `^4.1.0 -> ^3.15.2`, while its specs call `yaml.load()`,
      # the v4 API. Hold it until TASK-122 settles the conflict deliberately,
      # then delete this entry.
      - dependency-name: 'js-yaml'

    # Dependabot rebases every open PR when main moves. With build-and-test
    # required and "up to date" enforced, that is a CI storm on every merge, and
    # the backlog is 38 PRs deep. Rebase deliberately instead.
    rebase-strategy: 'disabled'

    # commitlint enforces conventional commits on this repo, so make Dependabot
    # comply by construction rather than fixing its messages by hand.
    #
    # `include: scope` makes Dependabot append the scope itself — `deps` for
    # runtime deps, `deps-dev` for dev ones — so `prefix` must NOT already
    # contain it. Getting this wrong produced `chore(deps)(deps): bump …`.
    # `prefix-development` is only needed to change the *type* word (e.g. to
    # `maint`); the deps-dev scope comes from `include` on its own.
    commit-message:
      prefix: 'chore'
      include: 'scope'

    # `security` is reserved for actual advisories, so it stays usable for triage.
    # Routine version bumps were being labelled `security` too, which is how 38 of
    # them became indistinguishable from real alerts.
    labels:
      - 'dependencies'
    assignees:
      - 'msimmer'

    # Groups apply to version updates only (that is the default for `applies-to`).
    # Security updates deliberately stay ungrouped — each one should be reviewable
    # and mergeable on its own.
    groups:
      babel:
        patterns:
          - '@babel/*'
        update-types: &group-update-types
          - 'minor'
          - 'patch'
      types:
        patterns:
          - '@types/*'
        update-types: *group-update-types
      testing:
        patterns:
          - 'jest*'
          - '@jest/*'
          - 'jest-*'
          - '@testing-library/*'
        update-types: *group-update-types
      linting:
        patterns:
          - 'biome'
          - '@biomejs/*'
        update-types: *group-update-types
      build-tools:
        patterns:
          - 'vite*'
          - '@vitejs/*'
          - 'rollup*'
          - 'tsdown*'
          - '@swc/*'
        update-types: *group-update-types
      react:
        patterns:
          - 'react'
          - 'react-*'
          - '@react-*'
        update-types: *group-update-types
      minor-patch:
        # Catch-all for everything the groups above do not claim. With majors
        # ignored, this is every remaining update.
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    # Deliberately NOT ignoring majors here. Actions version their whole runtime
    # in the major (actions/checkout v4 → v5 is the normal upgrade path), and
    # Dependabot's security advisories barely cover the ecosystem — so ignoring
    # majors would freeze these on an old runtime with nothing to unfreeze them.
    rebase-strategy: 'disabled'
    # No `include: scope` here: it would yield `chore(deps)`, indistinguishable
    # from an npm bump. A prefix ending in `)` gets the colon added for us.
    commit-message:
      prefix: 'chore(actions)'
    labels:
      - 'dependencies'
    assignees:
      - 'msimmer'
    groups:
      github-actions:
        patterns:
          - '*'
