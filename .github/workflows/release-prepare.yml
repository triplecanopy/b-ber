# Phase 1 of 2. Bumps versions and opens a PR; publishing happens in
# release-publish.yml once that PR merges.
#
# `main` is protected and requires a pull request, so `lerna publish` cannot be
# used here — it pushes its own version commit straight at `main` and fails.
# See AGENTS.md § Releases.
name: Release · prepare version PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

# Never let two releases interleave.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lerna reads tags and history to decide what changed.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Gate here rather than at publish time: this is the last point where a
      # human can still decide not to release. Build precedes test because
      # several packages' tests import a sibling's built dist.
      - name: Build
        run: npm run build

      - name: Lint and test
        run: npm test

      - name: Bump versions
        id: bump
        run: |
          # --no-git-tag-version leaves the bump UNCOMMITTED (lerna's flag means
          #   "do not commit or tag"), which is what we want: we commit it
          #   ourselves below, and the tag is created on `main` by
          #   release-publish.yml only after npm actually accepts the release.
          #   That way a tag can never point at a version that failed to publish,
          #   nor at a commit a squash-merge rewrote away.
          # --force-publish because lerna.json is in fixed mode and this
          #   workspace has always moved in lockstep (every package was 4.0.2);
          #   bump them together instead of letting change detection split it.
          npx lerna version "${{ inputs.bump }}" \
            --no-git-tag-version \
            --force-publish \
            --yes
          echo "version=$(node -p 'require("./lerna.json").version')" >> "$GITHUB_OUTPUT"

      - name: Format the bump
        run: |
          # lerna writes package.json with its own JSON formatter, which
          # disagrees with biome — it expands `"files": ["dist"]` across three
          # lines, and `biome check` treats that as an error. Locally this never
          # showed, because husky's lint-staged silently reformatted the staged
          # files as part of the version commit. The API commit below bypasses
          # git hooks entirely, so do it explicitly: otherwise the bump lands on
          # main unformatted and release-publish.yml's `npm test` fails there —
          # after the release PR has already merged. That happened on 4.0.3.
          #
          # Scoped to manifests, deliberately: lock files are biome-clean as npm
          # writes them and are best left alone.
          MANIFESTS="$(git diff --name-only | grep -E '(^|/)(package\.json|lerna\.json)$')"

          if [ -z "$MANIFESTS" ]; then
            echo "no manifests changed — did the bump run?" >&2
            exit 1
          fi

          printf '%s\n' "$MANIFESTS"
          # Piped into xargs rather than passed as an unquoted expansion: this
          # step runs under bash on the runner, which word-splits, but zsh does
          # not — so the unquoted form works in CI and silently passes one giant
          # argument when the same line is tested locally.
          printf '%s\n' "$MANIFESTS" | xargs npx biome check --write

      - name: Create the release branch with a GitHub-signed commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION='${{ steps.bump.outputs.version }}'
          BRANCH="release/$VERSION"
          # lerna left the bump uncommitted, so HEAD is still the base commit.
          BASE_SHA="$(git rev-parse HEAD)"

          # The branch has to exist before createCommitOnBranch can commit onto
          # it. Creating a ref is not a commit, so nothing is signed yet.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" > /dev/null

          node .github/scripts/build-release-commit.js \
            "$VERSION" "$BRANCH" "$BASE_SHA" "$GITHUB_REPOSITORY" payload.json

          # GitHub signs commits authored through this mutation, which is what
          # satisfies the required_signatures rule on main. A `git commit` here
          # would be unsigned and the release PR would be unmergeable.
          gh api graphql --input payload.json > result.json
          cat result.json

          # Fail loudly rather than opening a PR that cannot be merged.
          if [ "$(node -p "require('./result.json').data.createCommitOnBranch.commit.signature.isValid")" != "true" ]; then
            echo "commit is not validly signed — refusing to open the release PR" >&2
            exit 1
          fi

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION='${{ steps.bump.outputs.version }}'
          BRANCH="release/$VERSION"

          # Body via a file rather than a nested heredoc, which cannot terminate
          # inside an indented YAML block scalar.
          {
            printf 'Release **%s**, prepared by `release-prepare.yml`.\n\n' "$VERSION"
            printf 'Version bump (`%s`) across the workspace plus the refreshed\n' '${{ inputs.bump }}'
            printf 'lockfile. `npm run build` and `npm test` passed before this PR was opened.\n\n'
            printf '**Merging this PR publishes %s to npm.** `release-publish.yml` runs on\n' "$VERSION"
            printf 'push to `main`, rebuilds, publishes every package whose version is not\n'
            printf 'yet on the registry, then tags `v%s`.\n\n' "$VERSION"
            printf 'Merge by any method — the tag is created afterwards from `main`, so a\n'
            printf 'squash cannot orphan it.\n'
          } > release-pr-body.md

          gh pr create --base main --head "$BRANCH" \
            --title "$VERSION" --body-file release-pr-body.md
