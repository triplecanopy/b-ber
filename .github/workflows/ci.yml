# Gates pull requests on the same build and test that `release-publish.yml` runs.
#
# Why this exists: nothing gated PRs before. `.circleci/config.yml` claims to
# build every push and pull request, but CircleCI reports no statuses or check
# runs to GitHub, and the branch ruleset has no `required_status_checks` rule —
# so a PR could merge with a broken build. That is how the 4.0.3 release PR
# merged a version bump that could not publish: `release-prepare.yml` runs the
# gates *before* the bump, so a failure the bump itself causes only shows up
# after the merge, on main.
#
# Make the `build-and-test` check required on main (Settings → Rules) for this
# to actually block anything.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded run tells us nothing, so let a new push cancel it — except on
# main, where each commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Build precedes test because several packages' tests import a sibling's
      # built dist. Same order as release-publish.yml and CircleCI.
      - name: Build
        run: npm run build

      # `npm test` is `biome check .` then jest — the exact command that failed
      # on main after the 4.0.3 bump merged.
      - name: Lint and test
        run: npm test

  # Playwright CLI smoke tests and reader browser tests against this checkout's
  # own build (TASK-130). Jest mocks heavily: image-size, for one, is mocked in
  # the main tests of both packages that use it, so a breaking upgrade passes
  # Jest. This job is what runs the real build end to end.
  #
  # A separate job, and not yet a required check, so a red e2e run is visible
  # without blocking merges while the suite proves itself. Make it required
  # (see AGENTS.md "Requiring the CI gate") once it has been reliable.
  e2e:
    runs-on: ubuntu-latest
    env:
      # Skips the Vimeo test, which needs outbound network access.
      NO_NETWORK: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Newest 24.x, not whichever copy the runner image happens to have.
          # See TASK-135.
          check-latest: true
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Keyed on the installed Playwright version: a new version needs a
      # matching browser build.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/b-ber-testing

      # The browser binary is cached; its system libraries are not.
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: packages/b-ber-testing

      - name: CLI smoke and reader e2e
        run: npx playwright test
        working-directory: packages/b-ber-testing

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: packages/b-ber-testing/test-results/
          retention-days: 14
